# Monitoring stack for Project 5 — Prometheus + Grafana, local only.
# Run: docker compose -f monitoring/docker-compose.yml up -d
# Prometheus on :9090, Grafana on :3000 (admin/admin — LOCAL DEV ONLY,
# change before exposing anything; this stack is never exposed).
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: p5-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: p5-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
